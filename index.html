<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vineet Joshi — AI Fullstack Engineer building production Generative AI systems with RAG, agents, and secure backends."
    />
    <meta name="theme-color" content="#050818" />
    <meta property="og:image" content="/portrait.png" />
    <meta property="og:title" content="Vineet Joshi — AI Fullstack Engineer" />
    <meta
      property="og:description"
      content="Production Generative AI systems — RAG pipelines, agentic workflows, and secure backends."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Vineet Joshi — AI Fullstack Engineer</title>
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: #03050c;
        overflow: hidden;
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }
      #app-loader.app-loader--out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      html.app-loading body {
        overflow: hidden;
      }
    </style>
  </head>
  <body class="app-loading">
    <div id="app-loader" role="status" aria-live="polite" aria-label="Loading portfolio and agent">
      <div class="app-loader-grid" aria-hidden="true"></div>
      <div class="app-loader-scan" aria-hidden="true"></div>
      <div class="app-loader-glow" aria-hidden="true"></div>
      <div class="app-loader-panel">
        <div class="app-loader-ring-wrap">
          <svg class="app-loader-ring-svg" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="app-loader-ring-bg" cx="60" cy="60" r="52" />
            <circle class="app-loader-ring-fg" id="app-loader-ring" cx="60" cy="60" r="52" />
          </svg>
          <span class="app-loader-percent" id="app-loader-percent">0%</span>
        </div>
        <p class="app-loader-brand">VINEET&nbsp;JOSHI</p>
        <p class="app-loader-sub">CYBER WORKSPACE · AGENT CORE</p>
        <p class="app-loader-status" id="app-loader-status">INITIALIZING</p>
        <div class="app-loader-track" aria-hidden="true">
          <div class="app-loader-fill" id="app-loader-fill"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
